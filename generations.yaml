generations:
  - name: "First Generation"
    start_year: 2009
    end_year: 2010
    description: "The Dodge Journey was a mid-size crossover SUV that combined elements of a minivan with SUV styling. Built on Chrysler's JC platform shared with the Avenger sedan, it featured a front-wheel drive layout with available all-wheel drive. Initially available with a 2.4L four-cylinder or 3.5L V6, the Journey offered versatile family transportation with seating for up to seven passengers across three rows. The pre-facelift interior featured storage solutions including under-floor compartments and a front passenger seat with a hidden storage bin."

  - name: "First Generation (2011 Facelift)"
    start_year: 2011
    end_year: 2020
    description: "A significant refresh for the 2011 model year substantially improved the interior quality and introduced the Uconnect infotainment system. Revisions included modifications to the grille, lower front fascia, redesigned interior, suspension, steering, powertrain, and use of Dodge's new logo. The 2011 Journey received new Uconnect 3 infotainment systems with either 4.3-inch or 8.4-inch LCD color touchscreen displays, and a full-color LCD Electronic Vehicle Information Center (EVIC) in the instrument cluster. The Keyless Enter-'n'-Go System with keyless access and push-button start became standard on all models. Despite receiving only minor updates for the remainder of its production run, the Journey maintained steady sales by offering substantial value with competitive pricing and practical features. Production ended in 2020 without a direct replacement, as Dodge shifted focus to performance-oriented vehicles and SUVs."

